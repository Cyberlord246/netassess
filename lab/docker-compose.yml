# netassess test lab — intentionally-exposed services on an ISOLATED internal
# network, for validating netassess against real services safely.
#
#   cd lab
#   docker compose up -d web web2 cache          # start the targets
#   docker compose run --rm scanner              # scan them; report -> lab/out/
#   docker compose down -v                        # tear everything down
#
# SAFETY: the services below are deliberately weakly configured (unauthenticated
# Redis, exposed .env, etc.). They sit on an `internal` Docker network with NO
# published host ports and NO route to the internet, so they are only reachable
# by the scanner container in this lab. Never expose them; never run on an
# untrusted host. For authorized self-testing only.
name: netassess-lab

services:
  # nginx web server with an exposed .env, an admin page, robots.txt
  web:
    image: nginx:alpine
    volumes:
      - ./webroot:/usr/share/nginx/html:ro
    networks:
      labnet:
        ipv4_address: 172.28.0.10

  # apache httpd — different Server banner for tech-detection / role coverage
  web2:
    image: httpd:alpine
    networks:
      labnet:
        ipv4_address: 172.28.0.11

  # Redis with authentication + protected-mode disabled (unauthenticated access)
  cache:
    image: redis:alpine
    command: ["redis-server", "--protected-mode", "no", "--bind", "0.0.0.0"]
    networks:
      labnet:
        ipv4_address: 172.28.0.12

  # the scanner: builds/uses the netassess image and scans the lab subnet.
  # `profiles: [scan]` keeps it from auto-starting with `up`; use `run`.
  scanner:
    build: ..
    image: netassess:latest
    depends_on: [web, web2, cache]
    networks:
      labnet:
        ipv4_address: 172.28.0.5
    volumes:
      - ./out:/work/out
      - ./targets.txt:/work/targets.txt:ro
    entrypoint: ["netassess"]
    command: ["network", "scan", "--targets", "targets.txt",
              "--content-discovery", "--content-quick", "--output", "out"]
    profiles: ["scan"]

networks:
  labnet:
    driver: bridge
    internal: true          # no route to the internet — keeps the lab contained
    ipam:
      config:
        - subnet: 172.28.0.0/24
